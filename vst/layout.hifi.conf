[tab MANUAL]
art file=skin/looks/_bg_hifi.png
frame x=14 y=100 w=1252 h=604 title="MANUAL"
enum_h cx=640 cy=166 label="" key=manual_page sw=190 sh=56 rows=1
text cx=60 cy=240 label="POTENTIALHEAT: SOFT CLIPPER AND BUS SATURATOR" size=1.9 weight=700 align=left color=f4efe0 when=manual_page:0
text cx=60 cy=280 label="Pushes your drums, breaks or whole beat into a warm curve that rounds the peaks off instead of clipping. Louder," size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:0
text cx=60 cy=312 label="thicker and more together, without the harsh crackle." size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:0
text cx=62 cy=360 label="-" size=1.45 weight=700 case=none align=left color=f4efe0 when=manual_page:0
text cx=84 cy=360 label="Add it as an insert effect on a track, program, pad or bus. It is not in the instrument list." size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:0
text cx=62 cy=392 label="-" size=1.45 weight=700 case=none align=left color=f4efe0 when=manual_page:0
text cx=84 cy=392 label="Tap a preset on the HEAT page, then set how hard it works with DRIVE." size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:0
text cx=62 cy=424 label="-" size=1.45 weight=700 case=none align=left color=f4efe0 when=manual_page:0
text cx=84 cy=424 label="On a drum bus, try it after PotentialPunch: Punch shapes the hits, Heat warms them up and catches the peaks." size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:0
text cx=62 cy=456 label="-" size=1.45 weight=700 case=none align=left color=f4efe0 when=manual_page:0
text cx=84 cy=456 label="The meter shows how much is being shaved off the peaks." size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:0
text cx=60 cy=504 label="The full PotentialSuite manual: github.com/PotentialBreakfast/potential-plugins" size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:0
text cx=60 cy=240 label="CONTROLS" size=1.9 weight=700 align=left color=f4efe0 when=manual_page:1
text cx=62 cy=280 label="-" size=1.45 weight=700 case=none align=left color=f4efe0 when=manual_page:1
text cx=84 cy=280 label="DRIVE: how hard the sound is pushed into the curve, 0 to 24 dB." size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:1
text cx=62 cy=312 label="-" size=1.45 weight=700 case=none align=left color=f4efe0 when=manual_page:1
text cx=84 cy=312 label="CHARACTER: SOFT (clean until near the top, then warm and smooth), TAPE (a little darker and rounder) or HARD" size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:1
text cx=84 cy=344 label="(firmest and loudest)." size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:1
text cx=62 cy=376 label="-" size=1.45 weight=700 case=none align=left color=f4efe0 when=manual_page:1
text cx=84 cy=376 label="TONE: dark to bright, after the saturation." size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:1
text cx=62 cy=408 label="-" size=1.45 weight=700 case=none align=left color=f4efe0 when=manual_page:1
text cx=84 cy=408 label="CEILING: the most the peaks can reach, -6 to 0 dB. It never clips past it." size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:1
text cx=62 cy=440 label="-" size=1.45 weight=700 case=none align=left color=f4efe0 when=manual_page:1
text cx=84 cy=440 label="LEVEL MATCH: turns the processed sound down by the loudness it gained, so you hear the colour and not just" size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:1
text cx=84 cy=472 label="louder. Switch it off to use Heat as a loudness clipper." size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:1
text cx=62 cy=504 label="-" size=1.45 weight=700 case=none align=left color=f4efe0 when=manual_page:1
text cx=84 cy=504 label="MIX: blend with the original sound (parallel saturation). OUTPUT: the level after the effect." size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:1
text cx=62 cy=536 label="-" size=1.45 weight=700 case=none align=left color=f4efe0 when=manual_page:1
text cx=84 cy=536 label="ROLL: one tap for a random setting that still sounds good. MILD, MEDIUM or WILD sets how far it goes." size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:1
text cx=60 cy=240 label="PRESETS" size=1.9 weight=700 align=left color=f4efe0 when=manual_page:2
text cx=60 cy=280 label="One tap on the HEAT page, and in the MPC's PRESET menu. Each one is a starting point." size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:2
text cx=62 cy=328 label="-" size=1.45 weight=700 case=none align=left color=f4efe0 when=manual_page:2
text cx=84 cy=328 label="Warm Drums, Bus Glue, Break Heat, Loud & Clean, Smash, Tape Glow, Fat Kick, Snare Bite, Bass Warmth, Beat" size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:2
text cx=84 cy=360 label="Master, Parallel Crush and Peak Catcher." size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:2
text cx=62 cy=392 label="-" size=1.45 weight=700 case=none align=left color=f4efe0 when=manual_page:2
text cx=84 cy=392 label="Drum-bus pairs: Boom Bap Bus, Lo-Fi Bus, Modern Bus and Glue Bus are in PotentialPunch too. See the CHAINS" size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:2
text cx=84 cy=424 label="page." size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:2
text cx=60 cy=240 label="WORKING WITH THE OTHER PLUGINS" size=1.9 weight=700 align=left color=f4efe0 when=manual_page:3
text cx=62 cy=280 label="-" size=1.45 weight=700 case=none align=left color=f4efe0 when=manual_page:3
text cx=84 cy=280 label="Drum-bus pairs: put PotentialPunch first and Heat after it on your drum bus, then pick the same name in each:" size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:3
text cx=84 cy=312 label="Boom Bap Bus, Lo-Fi Bus, Modern Bus or Glue Bus." size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:3
text cx=62 cy=344 label="-" size=1.45 weight=700 case=none align=left color=f4efe0 when=manual_page:3
text cx=84 cy=344 label="After a chain: Heat works well as the last insert after Dusty Loop, 90s Stab, Break Bus or Dub Drums, to glue" size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:3
text cx=84 cy=376 label="the result and catch the peaks. Start with Bus Glue or Peak Catcher." size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:3
text cx=62 cy=408 label="-" size=1.45 weight=700 case=none align=left color=f4efe0 when=manual_page:3
text cx=84 cy=408 label="On the master: Beat Master or Loud & Clean, with LEVEL MATCH off, for loudness." size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:3
text cx=60 cy=456 label="The four chain presets are in Patina, Punch, Grit and Bleed. Their MANUAL pages show the insert order." size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:3
text cx=60 cy=504 label="Rules of thumb: Punch early, Heat late, and match levels with OUTPUT before you decide." size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:3
text cx=60 cy=240 label="USER PRESETS" size=1.9 weight=700 align=left color=f4efe0 when=manual_page:4
text cx=62 cy=280 label="-" size=1.45 weight=700 case=none align=left color=f4efe0 when=manual_page:4
text cx=84 cy=280 label="To save: open the USER page, tap SAVE, then tap a slot. The slot now reads USER and its number." size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:4
text cx=62 cy=312 label="-" size=1.45 weight=700 case=none align=left color=f4efe0 when=manual_page:4
text cx=84 cy=312 label="To load: tap a slot. The slot you loaded last is lit." size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:4
text cx=62 cy=344 label="-" size=1.45 weight=700 case=none align=left color=f4efe0 when=manual_page:4
text cx=84 cy=344 label="Saving to a slot that is already filled replaces it straight away." size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:4
text cx=62 cy=376 label="-" size=1.45 weight=700 case=none align=left color=f4efe0 when=manual_page:4
text cx=84 cy=376 label="The 8 slots are kept on the drive the plugin is on, in a folder called PotentialSuite Presets. Every project" size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:4
text cx=84 cy=408 label="and every copy of the plugin sees them, and updating the plugin keeps them." size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:4
text cx=62 cy=440 label="-" size=1.45 weight=700 case=none align=left color=f4efe0 when=manual_page:4
text cx=84 cy=440 label="A chain of your own: save each plugin's part to the same slot number, for example USER 3 in Punch and Heat." size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:4
text cx=84 cy=472 label="Later, tap USER 3 in each." size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:4
text cx=62 cy=504 label="-" size=1.45 weight=700 case=none align=left color=f4efe0 when=manual_page:4
text cx=84 cy=504 label="A slot keeps the knobs and switches. It does not keep the ROLL setting or the look." size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:4
text cx=60 cy=240 label="GOOD TO KNOW" size=1.9 weight=700 align=left color=f4efe0 when=manual_page:5
text cx=62 cy=280 label="-" size=1.45 weight=700 case=none align=left color=f4efe0 when=manual_page:5
text cx=84 cy=280 label="Q-Links: DRIVE, TONE, MIX, OUTPUT, PRESET, CHARACTER, CEILING and LEVEL MATCH." size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:5
text cx=62 cy=312 label="-" size=1.45 weight=700 case=none align=left color=f4efe0 when=manual_page:5
text cx=84 cy=312 label="Every setting is saved with your project." size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:5
text cx=62 cy=344 label="-" size=1.45 weight=700 case=none align=left color=f4efe0 when=manual_page:5
text cx=84 cy=344 label="Looks: Print Plate, Night Rack, Colour Block or Vintage, on the SETTINGS page. A new look shows the next time" size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:5
text cx=84 cy=376 label="the plugin loads." size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:5
text cx=62 cy=408 label="-" size=1.45 weight=700 case=none align=left color=f4efe0 when=manual_page:5
text cx=84 cy=408 label="It adds about 0.3 ms of delay (15 samples). The dry sound in MIX is delayed to match, so there is no phasing." size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:5
text cx=62 cy=440 label="-" size=1.45 weight=700 case=none align=left color=f4efe0 when=manual_page:5
text cx=84 cy=440 label="LEVEL MATCH evens out the average loudness over about a second, and it only turns down." size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:5
text cx=62 cy=472 label="-" size=1.45 weight=700 case=none align=left color=f4efe0 when=manual_page:5
text cx=84 cy=472 label="Stereo in, stereo out, at 44.1 kHz." size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:5
text cx=60 cy=520 label="Ideas, bugs and criticism are all welcome: github.com/PotentialBreakfast/mpc-vst-potentialheat" size=1.45 weight=600 case=none align=left color=b3ad9e when=manual_page:5
qlinks "MANUAL" = -
